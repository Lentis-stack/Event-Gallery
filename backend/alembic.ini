# ============================================================
# Lentis Gallery — Alembic Configuration
# ------------------------------------------------------------
# Alembic is the database MIGRATION tool.
#
# WHAT IS A MIGRATION?
#   A migration is a version-controlled recipe for changing the
#   database schema (adding/removing/altering tables or columns).
#
#   As the app evolves, the schema changes too. Alembic keeps a
#   history of these changes so any developer (or server) can
#   bring a database to the correct version by running:
#       alembic upgrade head
#
# This alembic.ini file is Alembic's configuration. It tells
# Alembic where to put its migration scripts and how to connect.
# Note: the actual database URL comes from our .env (via env.py),
# NOT from this file — so we never hardcode secrets here.
# ============================================================

[alembic]
# Directory where migration scripts live.
script_location = alembic

# The "migration template" used when generating new migrations.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Logging configuration for Alembic itself.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
