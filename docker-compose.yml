# ============================================================
# Lentis Gallery — Production Docker Compose
# ============================================================
# Architecture:
#                    Internet
#                       │
#                       ▼
#                    nginx (:80)         ← public entrypoint
#                    │         │
#                    ▼         ▼
#               React SPA   /api → FastAPI (:8000 internal)
#                              │
#                     ┌────────┴────────┐
#                     ▼                 ▼
#                 PostgreSQL          Redis
#               (internal only)    (internal only)
#                                     │
#                                     ▼
#                               Media Worker
#                                     │
#                                     ▼
#                              Cloudflare R2
#
# Usage:
#   1. cp .env.production.example .env.production
#   2. Edit .env.production with real values
#   3. docker compose --env-file .env.production up -d --build
#   4. docker compose exec backend alembic upgrade head
#   5. curl http://localhost/api/health
#
# IMPORTANT:
#   - PostgreSQL and Redis are NOT exposed to the host
#   - Backend is only reachable through nginx
#   - All secrets come from .env.production
# ============================================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lentis_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-lentis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lentis} -d ${POSTGRES_DB:-lentis_gallery}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lentis-internal
    # NOT exposed to host

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lentis-internal
    # NOT exposed to host

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      APP_NAME: "Lentis Gallery API"

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256

      # Token lifetimes
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Login rate limiting
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}

      # Database (connects via internal network)
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lentis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lentis_gallery}

      # CORS (internal — nginx handles public routing)
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      BACKEND_URL: http://backend:8000

      # API Documentation (disabled in production)
      ENABLE_DOCS: "false"

      # Rate Limiting
      RATE_LIMIT_GUEST_REGISTRATION: ${RATE_LIMIT_GUEST_REGISTRATION:-10}
      RATE_LIMIT_EVENT_MEDIA_UPLOAD: ${RATE_LIMIT_EVENT_MEDIA_UPLOAD:-30}

      # Request limits
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-629145600}

      # Guest sessions
      GUEST_SESSION_EXPIRE_HOURS: ${GUEST_SESSION_EXPIRE_HOURS:-6}

      # Media limits
      MAX_PHOTOS_PER_EVENT: ${MAX_PHOTOS_PER_EVENT:-10000}
      MAX_VIDEOS_PER_EVENT: ${MAX_VIDEOS_PER_EVENT:-5000}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-30}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-500}
      MAX_EVENT_STORAGE_GB: ${MAX_EVENT_STORAGE_GB:-50}

      # Storage (R2 for production)
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-lentis-media}
      R2_ENDPOINT: ${R2_ENDPOINT:-}

      # Redis (connects via internal network)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PROCESSING_QUEUE: media-processing

      # Media processing
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-3}
      IMAGE_OPTIMIZED_MAX_DIMENSION: ${IMAGE_OPTIMIZED_MAX_DIMENSION:-2560}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      IMAGE_THUMBNAIL_MAX_DIMENSION: ${IMAGE_THUMBNAIL_MAX_DIMENSION:-600}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-88}
      VIDEO_CRF: ${VIDEO_CRF:-23}
      VIDEO_PRESET: ${VIDEO_PRESET:-medium}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-1800}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - shared_storage:/app/storage
      - ./scripts:/scripts:ro
    networks:
      - lentis-internal
    # NOT exposed to host — nginx proxies to it

  # ---- Media Worker ----
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["rq", "worker", "media-processing", "--url", "redis://:${REDIS_PASSWORD}@redis:6379/0"]
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lentis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lentis_gallery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      BACKEND_URL: http://backend:8000
      ENABLE_DOCS: "false"
      PROCESSING_QUEUE: media-processing
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      LOCAL_STORAGE_PATH: /app/storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-lentis-media}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-3}
      IMAGE_OPTIMIZED_MAX_DIMENSION: ${IMAGE_OPTIMIZED_MAX_DIMENSION:-2560}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      IMAGE_THUMBNAIL_MAX_DIMENSION: ${IMAGE_THUMBNAIL_MAX_DIMENSION:-600}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-88}
      VIDEO_CRF: ${VIDEO_CRF:-23}
      VIDEO_PRESET: ${VIDEO_PRESET:-medium}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-1800}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - shared_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os; procs=[open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()]; raise SystemExit(0 if any(b'rq' in c for c in procs) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lentis-internal
    # NOT exposed to host

  # ---- PostgreSQL Backup Service ----
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lentis_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-lentis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - lentis_backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Install cron and schedule backup
        echo "${BACKUP_SCHEDULE:-0 2 * * *} /scripts/backup_postgres.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "Backup schedule: ${BACKUP_SCHEDULE:-0 2 * * *}"
        echo "Retention: ${BACKUP_RETENTION_DAYS:-7} days"
        # Run cron in foreground
        crond -f -l 8
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null && echo ok || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lentis-internal
    # NOT exposed to host

  # ---- Frontend (nginx — single public entrypoint) ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
    ports:
      # Public entrypoint — this is the only port exposed to the host
      - "${LISTEN_PORT:-80}:80"
    networks:
      - lentis-internal

# ---- Named Volumes ----
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  shared_storage:
    driver: local
  lentis_backups:
    driver: local

# ---- Internal Network ----
# PostgreSQL and Redis are NOT publicly accessible.
# Only nginx (frontend) is exposed.
networks:
  lentis-internal:
    driver: bridge
