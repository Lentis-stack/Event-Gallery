# ============================================================
# Lentis Gallery — Production Nginx Configuration
# ============================================================
# Architecture:
#   Browser → nginx (port 80/443)
#                 ├── /          → React SPA (static files)
#                 ├── /api/*     → FastAPI backend (internal:8000)
#                 └── /ws/*      → FastAPI WebSocket (internal:8000)
#
# PostgreSQL and Redis are NEVER exposed to the host.
# The backend is only reachable through this nginx proxy.
#
# HTTPS: Cloudflare terminates TLS at the edge.
# nginx sees plain HTTP from Cloudflare.
# ============================================================

# --- Backend upstream ---
upstream backend {
    server backend:8000;
    keepalive 32;
}

# NOTE: nginx:alpine does not include limit_req module.
# Rate limiting is handled by FastAPI (Redis-backed) — see backend rate_limit.py

# --- Logging ---
log_format lentis '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time';

access_log /var/log/nginx/access.log lentis;
error_log  /var/log/nginx/error.log warn;

# ============================================================
# HTTP server
# When Cloudflare terminates TLS, nginx receives plain HTTP.
# ============================================================
server {
    listen 80;
    server_name _;

    # --- Maximum request body (for file uploads) ---
    client_max_body_size 600m;
    client_body_buffer_size 1m;

    # --- Security headers (applied to all responses) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Content Security Policy ---
    # Restrict resource loading to prevent XSS and data injection.
    # 'unsafe-inline' is needed for React's inline styles and Vite's injected scripts.
    # 'blob:' is needed for camera stream URLs from getUserMedia().
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # --- HSTS (enable when Cloudflare/HTTPS is active) ---
    # Uncomment the line below once HTTPS is confirmed working.
    # This tells browsers to always use HTTPS for 2 years.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               application/wasm;
    gzip_min_length 256;
    gzip_vary on;

    # ============================================================
    # API proxy → FastAPI backend
    # ============================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts for large uploads (up to 600 MB images/videos)
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;

        # Don't buffer upload bodies into nginx — pass them through
        proxy_request_buffering off;
    }

    # ============================================================
    # WebSocket support (for real-time features)
    # ============================================================
    location /api/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket connections can be long-lived
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ============================================================
    # Health check (direct — no rate limit)
    # ============================================================
    location = /api/health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /api/health/ready {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================================
    # Static assets (Vite-generated, immutable with content hash)
    # ============================================================
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ============================================================
    # React SPA — all other routes serve index.html
    # ============================================================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # Block common attack paths
    # ============================================================

    # Block all dotfiles (except .well-known for ACME)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive file types
    location ~* \.(env|ini|conf|log|bak|sql|dump|key|pem|cert)$ {
        deny all;
    }

    # Block common WordPress/shell/backdoor paths
    location ~* /(wp-admin|wp-login|xmlrpc\.php|\.git|\.svn|\.env|shell|cmd|eval|exec) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block the root .env file specifically
    location = /.env {
        deny all;
    }
}

# ============================================================
# HTTPS server block (uncomment when TLS certificates are ready)
# ============================================================
# Cloudflare terminates TLS at the edge.
# In this case, nginx listens on port 80 and Cloudflare proxies to it.
# This is the RECOMMENDED configuration for Lentis.
#
# If you need nginx to handle TLS directly (without Cloudflare),
# uncomment the block below and configure your certificates.
#
